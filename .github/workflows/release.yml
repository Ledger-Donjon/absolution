---
name: 🚀 Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  build:
    environment: release
    strategy:
      matrix:
        os: [ubuntu-latest]
        optimize: [ReleaseSafe, ReleaseFast]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
      - uses: Ledger-Donjon/absolution/.github/actions/setup-zig@main
      - run: zig build -Doptimize=${{ matrix.optimize }} -Dstrip=true -Dversion="${RELEASE_TAG}" -Dtarget=x86_64-linux-gnu
      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: release-${{ matrix.os }}-${{ matrix.optimize }}
          path: zig-out/*
