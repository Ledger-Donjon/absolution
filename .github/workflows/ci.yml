---
name: ⚗️ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Ledger-Donjon/absolution/.github/actions/setup-zig@main
      - run: zig build test

  integration-test:
    needs: unit-test
    strategy:
      matrix:
        os: [ubuntu-latest]
        optimize: [ReleaseSafe, ReleaseFast]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: Ledger-Donjon/absolution/.github/actions/setup-zig@main
      - run: zig build -Doptimize=${{ matrix.optimize }}
      - run: zig run scripts/integration.zig  
